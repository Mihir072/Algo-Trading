spring:
  datasource:
    url: jdbc:h2:mem:algo_trading;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      url: redis://localhost:6379
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
angelone:
  instrument-master:
    enabled: false
market-session:
  open: "00:00"
  close: "23:59"
